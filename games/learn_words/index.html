<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Vyskúšaj sa v slovíčkach</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { background: #f5f7fb; }
        .app-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            padding: 24px;
            margin-top: 20px;
        }
        .question-title { font-weight: 600; }
        ul { padding-left: 1.2rem; }
    </style>

    <script>
        /* ==========================
           GLOBALS
        ========================== */
        let AllDictionaries = {};
        let TestWords = [];      // [foreign, slovak, language]
        let OriginalWords = [];  // backup for restart
        let WordPosition = 0;
        let from_to = "to_sk";

        let WrongWords = {};     // foreign -> { foreign, slovak, attempts }
        let WrongOrder = [];     // order of first wrong
        let Mastered = {};       // foreign -> true if answered correctly after being wrong
        let RepeatList = [];     // words to repeat
        let InRepeatRound = false;

        let answeredInitial = 0; // how many words answered in initial round
        let CorrectFirstTry = 0; // correct on first try

        /* ==========================
           LOAD DICTIONARY
        ========================== */
        function ReadDictionary() {
            $.ajax({
                url: "https://www.nelicorn.com/games/learn_words/german_dictionary.json",
                dataType: "json"
            }).done(function (result) {
                AllDictionaries = result;
                buildLanguageList();
            });
        }

        function buildLanguageList() {
            const LanguageList = Object.keys(AllDictionaries);
            let html = "";

            LanguageList.forEach((key, index) => {
                html += `
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="language${index}" value="${key}" onchange="LanguageSelected()">
                        <label class="form-check-label" for="language${index}">
                            ${key}
                        </label>
                    </div>`;
            });

            document.getElementById("language").innerHTML = html;
        }

        /* ==========================
           LANGUAGE SELECTED
        ========================== */
        function LanguageSelected() {
            let lessons = "";
            const LanguageList = Object.keys(AllDictionaries);

            LanguageList.forEach((key, index) => {
                const langCheckbox = document.getElementById("language" + index);
                if (langCheckbox && langCheckbox.checked) {

                    lessons += `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#${key}Dictionary">
                                    <h5 class="text-body mb-0"><i class="bi bi-book me-2"></i>${key}</h5>
                                </button>
                            </h2>
                            <div id="${key}Dictionary" class="accordion-collapse collapse show ps-3">
                                <div class="accordion-body">
                    `;

                    const LessonList = Object.keys(AllDictionaries[key]);
                    LessonList.forEach((lesson, LessonIndex) => {
                        const WordList = Object.keys(AllDictionaries[key][lesson]);
                        lessons += `
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="${key}${LessonIndex}" value="${lesson}" onchange="LessonSelected()">
                                <label class="form-check-label" for="${key}${LessonIndex}">
                                    ${lesson} (${WordList.length})
                                </label>
                            </div>`;
                    });

                    lessons += `
                                </div>
                            </div>
                        </div>`;
                }
            });

            document.getElementById("list-dictionaries").style.display = lessons ? "block" : "none";
            document.getElementById("lessons").innerHTML = lessons;
            document.getElementById("controls").innerHTML = "";
        }

        /* ==========================
           LESSON SELECTED
        ========================== */
        function LessonSelected() {
            TestWords = [];
            let LessonChecked = false;

            const LanguageList = Object.keys(AllDictionaries);

            LanguageList.forEach((key, index) => {
                const langCheckbox = document.getElementById("language" + index);
                if (langCheckbox && langCheckbox.checked) {

                    const LessonList = Object.keys(AllDictionaries[key]);
                    LessonList.forEach((lesson, LessonIndex) => {
                        const lessonCheckbox = document.getElementById(`${key}${LessonIndex}`);
                        if (lessonCheckbox && lessonCheckbox.checked) {
                            LessonChecked = true;

                            const WordList = Object.keys(AllDictionaries[key][lesson]);

                            // JSON is Slovak -> German
                            WordList.forEach(slovakWord => {
                                let germanWord = AllDictionaries[key][lesson][slovakWord];
                                TestWords.push([germanWord, slovakWord, key]);
                            });
                        }
                    });
                }
            });

            if (LessonChecked) {
                document.getElementById("controls").innerHTML = `
                    <h3 class="text-secondary mt-4">Smer skúšania</h3>
                    <div class="container-fluid px-0">
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="radio" id="to_sk" name="directions" value="to_sk">
                            <label class="form-check-label" for="to_sk">Do slovenčiny</label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="radio" id="from_sk" name="directions" value="from_sk">
                            <label class="form-check-label" for="from_sk">Zo slovenčiny</label>
                        </div>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="radio" id="both" name="directions" value="both" checked>
                            <label class="form-check-label" for="both">Obidve</label>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary mt-4 w-100" onclick="StartTest()">
                        Začať test <i class="bi bi-play-circle"></i>
                    </button>
                `;
            } else {
                document.getElementById("controls").innerHTML = "";
            }
        }

        /* ==========================
           HELPERS
        ========================== */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function setDirection() {
            if (document.getElementById("both").checked) {
                from_to = Math.random() < 0.5 ? "to_sk" : "from_sk";
            } else if (document.getElementById("from_sk").checked) {
                from_to = "from_sk";
            } else {
                from_to = "to_sk";
            }
        }

        /* ==========================
           RENDER QUESTION
        ========================== */
        function ShowWord(foreign, slovak, language, direction) {
            let text = "";

            if (direction === "to_sk") {
                text = `<h3 class="text-secondary mt-2 question-title text-center">
                            Prelož <span class="text-dark">${foreign}</span> → <span class="text-dark">Slovenčina</span>
                        </h3>`;
            } else {
                text = `<h3 class="text-secondary mt-2 question-title text-center">
                            Prelož <span class="text-dark">${slovak}</span> → <span class="text-dark">${language}</span>
                        </h3>`;
            }

            text += `
                <div class="container-fluid px-0 mt-3">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control form-control-lg" id="result" placeholder="Napíš odpoveď">
                        <button class="btn btn-primary btn-lg" id="ShowResult" onclick="ShowResult()">OK</button>
                    </div>
                </div>
            `;
            return text;
        }

        /* ==========================
           START TEST
        ========================== */
        function StartTest() {
            OriginalWords = [...TestWords]; // backup for restart
            restartQuiz();
        }

        function restartQuiz() {
            TestWords = [...OriginalWords];
            shuffle(TestWords);

            WordPosition = 0;
            WrongWords = {};
            WrongOrder = [];
            Mastered = {};
            RepeatList = [];
            InRepeatRound = false;
            answeredInitial = 0;
            CorrectFirstTry = 0;

            document.getElementById("test-stopped").style.display = "none";
            document.getElementById("test-running").style.display = "block";

            showCurrent();
        }

        /* ==========================
           SHOW CURRENT WORD
        ========================== */
        function showCurrent() {
            let list = InRepeatRound ? RepeatList : TestWords;

            if (WordPosition >= list.length) {

                // Build repeat list
                RepeatList = WrongOrder
                    .filter(f => !Mastered[f])
                    .map(f => {
                        let w = WrongWords[f];
                        return [w.foreign, w.slovak, ""];
                    });

                if (RepeatList.length > 0) {
                    startRepeatRound();
                    return;
                }

                EndTest();
                return;
            }

            let word = list[WordPosition];
            let foreign = word[0];
            let slovak = word[1];
            let lang = word[2];

            setDirection();

            document.getElementById("test").innerHTML =
                ShowWord(foreign, slovak, lang, from_to);

            SetEnterEvent();
            document.getElementById("result").focus();
            updateScoreDisplay();
        }

        /* ==========================
           SHOW RESULT
        ========================== */
        function ShowResult() {
            const input = document.getElementById("result").value.trim();
            if (input === "") {
                document.getElementById("answwer").innerHTML =
                    `<p class="text-warning mt-2"><i class="bi bi-exclamation-circle"></i> Najprv niečo napíš.</p>`;
                return;
            }

            let list = InRepeatRound ? RepeatList : TestWords;
            let word = list[WordPosition];

            let foreign = word[0];
            let slovak = word[1];

            let correct = (from_to === "to_sk") ? slovak : foreign;
            let user = input.toLowerCase();
            let correctLower = correct.toLowerCase();

            let firstTimeWrong = false;

            if (user === correctLower) {
                document.getElementById("answwer").innerHTML =
                    `<p class="text-success mt-2"><i class="bi bi-check-circle"></i> Správne!</p>`;

                if (!InRepeatRound) {
                    answeredInitial++;
                }

                if (!WrongWords[foreign]) {
                    CorrectFirstTry++;
                }

                if (WrongWords[foreign]) {
                    Mastered[foreign] = true;
                }

                if (InRepeatRound) {
                    RepeatList.splice(WordPosition, 1);
                    showCurrent();
                    return;
                }

            } else {
                document.getElementById("answwer").innerHTML =
                    `<p class="text-danger mt-2"><i class="bi bi-x-circle"></i> Neprávne — ${foreign} = ${slovak}</p>`;

                if (!InRepeatRound) {
                    answeredInitial++;
                }

                if (!WrongWords[foreign]) {
                    WrongWords[foreign] = { foreign, slovak, attempts: 1 };
                    WrongOrder.push(foreign);
                } else {
                    WrongWords[foreign].attempts++;
                }
            }

            WordPosition++;
            showCurrent();
        }

        /* ==========================
           START REPEAT ROUND
        ========================== */
        function startRepeatRound() {
            InRepeatRound = true;
            WordPosition = 0;

            document.getElementById("answwer").innerHTML =
                `<p class="text-info mt-3"><i class="bi bi-arrow-repeat"></i> Opakovanie nesprávnych slov...</p>`;

            showCurrent();
        }

        /* ==========================
           END TEST
        ========================== */
        function EndTest() {
            const totalWords = TestWords.length;
            const incorrectWords = Object.keys(WrongWords).length;
            const correctWords = CorrectFirstTry;

            let summary = `
                <h3 class="text-secondary mt-2">Koniec testu</h3>
                <p class="mt-2">Správne: <strong>${correctWords}</strong> z <strong>${totalWords}</strong></p>
            `;

            if (WrongOrder.length > 0) {
                summary += `<h4 class="mt-4">Slová na zopakovanie</h4><ul class="mt-2">`;
                WrongOrder.forEach(f => {
                    const w = WrongWords[f];
                    summary += `<li>${w.foreign} = ${w.slovak} — pokusy: ${w.attempts}</li>`;
                });
                summary += `</ul>`;
            }

            summary += `
                <button class="btn btn-primary mt-4 w-100" onclick="restartQuiz()">
                    Skúsiť znova
                </button>`;

            document.getElementById("test").innerHTML = summary;
            document.getElementById("answwer").innerHTML = "";

            document.getElementById("score").innerHTML =
                `<p class="mb-0">Správne: ${correctWords} / Nesprávne: ${incorrectWords} / Zostáva: 0</p>`;
        }

        /* ==========================
           SCORE DISPLAY
        ========================== */
        function updateScoreDisplay() {
            const totalWords = TestWords.length;
            const incorrectWords = Object.keys(WrongWords).length;
            const correctWords = CorrectFirstTry;

            let remaining = (totalWords - answeredInitial) + RepeatList.length;
            if (remaining < 0) remaining = 0;

            document.getElementById("score").innerHTML =
                `<p class="mb-0">Správne: ${correctWords} / Nesprávne: ${incorrectWords} / Zostáva: ${remaining}</p>`;
        }

        /* ==========================
           RESTART
        ========================== */
        function StartAgain() {
            restartQuiz();
        }

        /* ==========================
           ENTER KEY SUPPORT
        ========================== */
        function SetEnterEvent() {
            const input = document.getElementById("result");
            if (!input) return;

            input.addEventListener("keyup", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    document.getElementById("ShowResult").click();
                }
            });
        }
    </script>
</head>

<body onload="ReadDictionary()">
    <div class="container py-3">
        <div id="test-stopped">
            <div class="app-card">
                <h1 class="text-primary mb-3">
                    <i class="bi bi-patch-question-fill me-2"></i>Vyskúšaj sa v slovíčkach
                </h1>

                <h3 class="text-secondary mt-3">Vyber si slovník</h3>
                <div class="mt-2">
                    <div id="language" class="form-check"></div>
                </div>

                <div id="list-dictionaries" class="mt-4" style="display:none">
                    <h3 class="text-secondary">Vyber si lekcie</h3>
                    <div class="accordion" id="lessons"></div>
                </div>

                <div id="controls" class="mt-3"></div>
            </div>
        </div>

        <div id="test-running" style="display:none">
            <div class="app-card">
                <h1 class="text-primary mb-3">
                    <i class="bi bi-patch-question-fill me-2"></i>Vyskúšaj sa v slovíčkach
                </h1>

                <div id="test" class="mt-2"></div>

                <div class="mt-2">
                    <div id="answwer"></div>
                </div>

                <h3 class="text-secondary mt-4">Vyhodnotenie</h3>
                <div id="score" class="mt-1">
                    <p class="mb-0">Správne: 0 / Nesprávne: 0 / Zostáva: 0</p>
                </div>

                <button type="button" class="btn btn-link mt-3 px-0" onclick="restartQuiz()">
                    <i class="bi bi-arrow-left me-2"></i>Späť / Ukončiť
